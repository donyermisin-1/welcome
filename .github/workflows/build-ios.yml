name: Build iOS app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app for iPhone
        run: |
          xcodebuild \
            -project HelloWelcomeToiOS.xcodeproj \
            -scheme HelloWelcomeToiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/HelloWelcomeToiOS.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r HelloWelcomeToiOS-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloWelcomeToiOS-unsigned-ipa
          path: build/HelloWelcomeToiOS-unsigned.ipa
