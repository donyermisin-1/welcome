name: Build iOS app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app for iPhone
        run: |
          xcodebuild \
            -project HelloWelcomeToiOS.xcodeproj \
            -scheme HelloWelcomeToiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/HelloWelcomeToiOS.app"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r HelloWelcomeToiOS-unsigned.ipa Payload
      - name: Publish IPA as a direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-build-${{ github.run_number }}
          name: IPA build ${{ github.run_number }}
          files: build/HelloWelcomeToiOS-unsigned.ipa
          make_latest: true
